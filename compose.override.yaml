services:
  sf-php:
    environment:
      APP_ENV: dev
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-http://localhost:8180/.well-known/mercure}
    ports:
      - "8180:80"
      - "8443:443"
    volumes:
      - .:/app
      - ./docker/caddy/Caddyfile:/etc/frankenphp/Caddyfile
      - ./docker/server/php/php.ini:/usr/local/etc/php/conf.d/extra-php-config.ini:ro
  sf-node:
    command: ["sh", "-c", "npm install && npm run watch"]
  sf-db:
    ports:
      - "3381:3306"
  sf-mailer:
    ports:
      - "8125:8025"
